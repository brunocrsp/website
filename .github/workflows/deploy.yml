name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if the triggering CI run succeeded (or if triggered manually)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test
        # The site is served on its own domain since the custom_domain
        # routes of wrangler.jsonc. The first deploy that carries them
        # creates the DNS records, which can take a minute to answer.
        run: |
          for url in https://meshvise.com/fr/ https://www.meshvise.com/en/; do
            for i in 1 2 3 4 5 6; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url")
              [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ] && break
              sleep 10
            done
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
              echo "Smoke test failed on $url: got HTTP $HTTP_CODE"
              exit 1
            fi
            echo "Smoke test passed on $url (HTTP $HTTP_CODE)"
          done

